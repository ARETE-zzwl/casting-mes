spring.application.name=mes-backend
server.address=127.0.0.1
server.port=${MES_SERVER_PORT:8081}
spring.datasource.url=jdbc:h2:file:./data/casting-mes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.ignore-migration-patterns=*:future
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.connection-timeout=5s
server.tomcat.accept-count=100
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
spring.datasource.hikari.maximum-pool-size=${MES_DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${MES_DB_POOL_MIN:4}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
mes.web.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
mes.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
mes.ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
mes.ai.deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
mes.storage.upload-dir=${MES_UPLOAD_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
mes.inventory.export-max-rows=${MES_EXPORT_MAX_ROWS:50000}
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=25
