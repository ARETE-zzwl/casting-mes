spring.datasource.url=${MES_DATABASE_URL}
spring.datasource.username=${MES_DATABASE_USERNAME}
spring.datasource.password=${MES_DATABASE_PASSWORD}
server.address=${MES_SERVER_ADDRESS:0.0.0.0}
server.port=${MES_SERVER_PORT:8081}
spring.jpa.hibernate.ddl-auto=validate
mes.web.allowed-origins=${MES_ALLOWED_ORIGINS}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MES_OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${MES_OIDC_AUDIENCE:casting-mes}
spring.flyway.ignore-migration-patterns=
mes.auth.bootstrap-admin-password=${MES_BOOTSTRAP_ADMIN_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
